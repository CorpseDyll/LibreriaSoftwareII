<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Libreria Software II</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Libreria Software II</h1>
        <p>Bienvenidos a nuestra libreria virtual</p>
    </header>
    <main class="library-content">
        <div class="search-section">
            <input
                type="text"
                id="search-input"
                placeholder="Buscar por título, autor o género..."
            >
            <button id="search-button">Buscar</button>
        </div>
        <h2>Libros disponibles</h2>
        <div id="books-container">

        </div>
    </main>
    <div id="book-modal" class="book-modal">
        <div class="book-modal-content">
            <button id="close-modal" class="close-modal">
                X
            </button>
            <h2 id="modal-title"></h2>
            <p class="modal-author" id="modal-author"></p>
            <div class="modal-divider"></div>
            <p>
                <strong>ISBN:</strong>
                <span id="modal-isbn"></span>
            </p>
            <p>
                <strong>Género:</strong>
                <span id="modal-genre"></span>
            </p>
            <p>
                <strong>Tipo:</strong>
                <span id="modal-type"></span>
            </p>
            <p>
                <strong>Precio:</strong>
                <span id="modal-price"></span>
            </p>
            <p>
                <strong>Calificación:</strong>
                <span id="modal-rating"></span>
            </p>
            <p>
                <strong>Valoraciones:</strong>
                <span id="modal-rating-count"></span>
            </p>
            <div class="modal-divider"></div>
            <h3>Descripción</h3>
            <p id="modal-description"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
