# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS Y SPRING BOOT - LIBRERÍA DE SOFTWARE
# ===================================================================

spring.application.name=libreria-software-ii
server.port=8080

# -------------------------------------------------------------------
# OPCIÓN 1: BASE DE DATOS EN MEMORIA H2 (DESHABILITADA)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:libreriadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false

# -------------------------------------------------------------------
# OPCIÓN 2: CONEXIÓN A NEON POSTGRESQL (ACTIVA DESDE ARCHIVO .ENV)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------------
# CONFIGURACIÓN JPA / HIBERNATE
# -------------------------------------------------------------------
# 'update': crea o actualiza las tablas automáticamente en Neon al iniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Formato JSON para fechas
spring.jackson.serialization.write-dates-as-timestamps=false