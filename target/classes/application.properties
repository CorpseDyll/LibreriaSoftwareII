# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS Y SPRING BOOT - LIBRERÍA DE SOFTWARE
# ===================================================================

spring.application.name=libreria-software-ii
server.port=8080

# -------------------------------------------------------------------
# OPCCIÓN 1: BASE DE DATOS EN MEMORIA H2 (CONFIGURACIÓN POR DEFECTO)
# Ideal para desarrollo rápido y pruebas sin necesidad de instalar BD local.
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:libreriadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilitar Consola Web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# OPCIÓN 2: CONEXIÓN A MYSQL (Para conectar una BD MySQL activa)
# Descomente las líneas inferiores y reemplace con sus credenciales:
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/libreriadb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=su_contraseña
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# OPCIÓN 3: CONEXIÓN A POSTGRESQL (Para conectar una BD PostgreSQL activa)
# Descomente las líneas inferiores y reemplace con sus credenciales:
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:postgresql://localhost:5432/libreriadb
# spring.datasource.username=postgres
# spring.datasource.password=su_contraseña
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------------
# CONFIGURACIÓN J PA / HIBERNATE
# -------------------------------------------------------------------
# 'update': crea o actualiza las tablas automáticamente al iniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Formato JSON para fechas
spring.jackson.serialization.write-dates-as-timestamps=false
